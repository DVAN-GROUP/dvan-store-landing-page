<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Chi Tiết Ứng Dụng - DVAN GROUP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <style>
      .app-detail-hero {
        padding: 60px 0 40px;
      }
      .detail-container {
        max-width: 900px;
        margin: 0 auto;
      }
      .app-main-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        padding: 40px;
        box-shadow: var(--shadow-md);
        margin-bottom: 30px;
      }
      .app-headline {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        margin-bottom: 28px;
      }
      .app-big-icon {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: var(--shadow-md);
        flex-shrink: 0;
      }
      .meta-box-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        background: rgba(0, 0, 0, 0.2);
        padding: 20px;
        border-radius: var(--radius-md);
        margin: 28px 0;
        text-align: center;
      }
      .meta-box-val {
        font-size: 1.4rem;
        font-weight: 700;
      }
      .meta-box-lbl {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .feature-list {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
        margin: 20px 0 32px;
      }
      .feature-list li {
        background: rgba(255, 255, 255, 0.03);
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        border-left: 3px solid var(--primary);
        font-size: 0.95rem;
        color: var(--text-muted);
      }
      .action-bar {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 30px;
      }
      @media (max-width: 700px) {
        .app-headline {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        .meta-box-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .app-main-card {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-glow-top"></div>

    <!-- Navbar -->
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="brand-logo">
          <div class="logo-icon">🚀</div>
          <span>DVAN GROUP</span>
        </a>

        <div class="nav-actions">
          <button
            class="theme-toggle-btn"
            id="themeToggleBtn"
            title="Chuyển chế độ sáng/tối"
          >
            <span id="themeIcon">☀️</span>
          </button>
          <a href="index.html#apps" class="btn btn-secondary btn-sm"
            >← Tất cả ứng dụng</a
          >
        </div>
      </div>
    </header>

    <main class="container app-detail-hero">
      <div class="detail-container" id="appContent">
        <div style="text-align: center; padding: 60px 0">
          <p>Đang tải thông tin ứng dụng...</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div
        class="container"
        style="text-align: center; color: var(--text-dim); font-size: 0.85rem"
      >
        reserved.
      </div>
    </footer>

    <script src="js/translations.js"></script>
    <script src="js/apps-data.js"></script>
    <script src="js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const appId = params.get("id");
        const rawApp =
          typeof APPS_DATA !== "undefined"
            ? APPS_DATA.find((a) => a.id === appId)
            : null;
        const container = document.getElementById("appContent");

        if (!rawApp) {
          container.innerHTML = `
          <div class="app-main-card" style="text-align: center; padding: 60px 20px;">
            <p style="font-size: 3rem; margin-bottom: 12px;">📱</p>
            <h2>${escapeHtml(t("apps.emptyTitle", "Không tìm thấy ứng dụng"))}</h2>
            <p style="color: var(--text-muted); margin: 12px 0 24px;">Ứng dụng bạn tìm kiếm không tồn tại hoặc đã được cập nhật.</p>
            <a href="index.html#apps" class="btn btn-primary">${escapeHtml(t("nav.viewApps", "Xem toàn bộ ứng dụng"))}</a>
          </div>
        `;
          return;
        }

        const app = (typeof getLocalizedApp === "function") ? getLocalizedApp(rawApp) : rawApp;

        document.getElementById("pageTitle").textContent =
          `${app.name} - DVAN GROUP`;

        container.innerHTML = `
        <div class="app-main-card">
          <div class="app-headline">
            <img class="app-big-icon" src="${app.icon}" alt="${escapeHtml(app.name)}">
            <div style="flex: 1;">
              <span class="section-tag" style="margin-bottom: 8px;">${escapeHtml(app.category)}</span>
              <h1 style="font-size: 2rem; margin-bottom: 8px;">${escapeHtml(app.name)}</h1>
              <p style="color: var(--text-muted); font-size: 1.05rem;">${escapeHtml(app.tagline)}</p>
            </div>
          </div>

          <div class="meta-box-grid">
            <div>
              <div class="meta-box-val" style="color: #fbbf24;">★ ${app.rating}</div>
              <div class="meta-box-lbl">${app.reviewsCount > 0 ? `${app.reviewsCount} ${t("modal.reviews", "đánh giá")}` : t("modal.updating", "Đang cập nhật")}</div>
            </div>
            <div>
              <div class="meta-box-val" style="color: var(--primary);">${app.downloads}</div>
              <div class="meta-box-lbl">${escapeHtml(t("modal.installs", "Lượt tải xuống"))}</div>
            </div>
            <div>
              <div class="meta-box-val">v${app.version}</div>
              <div class="meta-box-lbl">${escapeHtml(t("modal.version", "Phiên bản"))}</div>
            </div>
            <div>
              <div class="meta-box-val">Android / iOS</div>
              <div class="meta-box-lbl">Platform</div>
            </div>
          </div>

          <h3 style="font-size: 1.3rem; margin-bottom: 12px;">${escapeHtml(t("modal.intro", "Giới thiệu chi tiết"))}</h3>
          <p style="color: var(--text-muted); line-height: 1.8; font-size: 1rem; margin-bottom: 28px;">
            ${escapeHtml(app.description)}
          </p>

          <h3 style="font-size: 1.3rem; margin-bottom: 12px;">${escapeHtml(t("modal.features", "Tính năng nổi bật"))}</h3>
          <ul class="feature-list">
            ${(app.features || []).map((f) => `<li>✓ ${escapeHtml(f)}</li>`).join("")}
          </ul>

          <div class="action-bar">
            ${
              app.links.googlePlay
                ? `
              <a href="${app.links.googlePlay}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                ${escapeHtml(t("modal.getPlay", "Tải về trên Google Play"))}
              </a>
            `
                : `
              <button class="btn btn-outline" disabled style="opacity: 0.6;">${escapeHtml(t("apps.btnComingSoon", "Sắp ra mắt"))}</button>
            `
            }
            ${
              app.links.appStore
                ? `
              <a href="${app.links.appStore}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                ${escapeHtml(t("modal.getAppStore", "Tải trên App Store"))}
              </a>
            `
                : ""
            }
            <a href="${app.links.privacyPolicy || "privacy-policy.html"}" class="btn btn-outline">
              ${escapeHtml(t("modal.privacyLink", "Chính sách quyền riêng tư"))}
            </a>
          </div>
        </div>
      `;
      });
    </script>
  </body>
</html>
